services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tappafurba-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tappafurba
      POSTGRES_PASSWORD: tappafurba
      POSTGRES_DB: tappafurba
    ports:
      # 5433 sull'host per non collidere con un eventuale PostgreSQL nativo già in ascolto sulla 5432
      - "5433:5432"
    volumes:
      - tappafurba-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tappafurba -d tappafurba"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tappafurba-db-data:
